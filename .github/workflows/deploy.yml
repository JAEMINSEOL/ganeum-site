name: Deploy site to GitHub Pages

on:
  push:
    branches: [ main ]

  workflow_dispatch:
  # 예약 게시: 칼럼 게시 시각은 05:00 KST로 통일. 매일 05:00 KST(전날 20:00 UTC)에 다시 빌드해
  # 게시일이 된 글을 올린다. GitHub 예약 실행은 실측 3~4시간 늦게 돌기도 해서 같은 날 몇 번 더 돈다
  # (05:30, 06:30, 07:30 KST). 오전 8~9시 전에는 올라가도록 여유를 둔 시각이다.
  schedule:
    - cron: '0 20 * * *'
    - cron: '30 20 * * *'
    - cron: '30 21 * * *'
    - cron: '30 22 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install, build, and upload site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
