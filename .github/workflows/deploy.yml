name: Deploy site to GitHub Pages

on:
  push:
    branches: [ main ]

  workflow_dispatch:
  # 예약 게시: 매일 09:00 KST(00:00 UTC)에 다시 빌드해 게시일이 된 글을 올린다.
  # GitHub 예약 실행은 몇 분~수십 분 늦을 수 있어 09:20 KST에 한 번 더 돈다.
  schedule:
    - cron: '0 0 * * *'
    - cron: '20 0 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install, build, and upload site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
