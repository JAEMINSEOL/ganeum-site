name: Deploy site to GitHub Pages

on:
  push:
    branches: [ main ]

  workflow_dispatch:
  # 예약 게시: 칼럼 게시 시각은 08:00 KST로 통일. 매일 08:00 KST(전날 23:00 UTC)에 다시 빌드해
  # 게시일이 된 글을 올린다. GitHub 예약 실행은 실측 3~4시간 늦게 돌기도 해서, 같은 날 몇 번 더 돈다
  # (빌드는 같은 결과를 다시 만드는 것이라 여러 번 돌아도 문제없다).
  schedule:
    - cron: '0 23 * * *'
    - cron: '30 23 * * *'
    - cron: '30 0 * * *'
    - cron: '30 1 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install, build, and upload site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
